[package]
name = "betterman_ai"
version = "0.1.0"
edition = "2021"
description = "BettermanAI - Your Personal Workflow Optimizer"
authors = ["BettermanAI Team"]

[dependencies]
# Web framework and utilities
actix-web = "4.3.1"
actix-files = "0.6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.28.0", features = ["full"] }
futures = "0.3"

# System and utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.3.1", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.10"
dotenv = "0.15"
thiserror = "1.0"
anyhow = "1.0"

# File operations and process management
tempfile = "3.5.0"
fs_extra = "1.3.0"
walkdir = "2.3.3"
notify = "5.1.0"
process_control = "4.0.0"

# For path operations
path-absolutize = "3.1.0"

# For TagUI wrapper
reqwest = { version = "0.11", features = ["json"] }
yaml-rust = "0.4"
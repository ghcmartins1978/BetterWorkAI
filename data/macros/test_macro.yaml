metadata:
  name: Test Macro
  description: A simple test macro for validating the execution process
  id: test_macro
  tags:
    - test
    - demo
  created_at: 1619544000
  updated_at: 1619544000

variables:
  text_to_type: Hello from BettermanAI!
  wait_time: 1

steps:
  - type: mouse_move
    params:
      x: 100
      y: 100
  - type: mouse_click
    params:
      button: left
      clicks: 1
  - type: keyboard_type
    params:
      text: Hello, world!
  - type: keyboard_press
    params:
      key: enter
  - type: wait
    params:
      seconds: 2
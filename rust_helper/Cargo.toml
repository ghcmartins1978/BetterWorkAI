[package]
name = "betterman_helper"
version = "0.1.0"
edition = "2021"
authors = ["BettermanAI <info@betterman.ai>"]
description = "Automation helper for BettermanAI"

[dependencies]
# Web server
actix-web = "4.3.1"
actix-cors = "0.6.4"
actix-files = "0.6.2"

# Async support
tokio = { version = "1.28.1", features = ["full"] }
futures = "0.3.28"

# Serialization/deserialization
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"

# Logging
log = "0.4.17"
env_logger = "0.10.0"

# Date and time
chrono = { version = "0.4.24", features = ["serde"] }

# System automation
enigo = "0.1.2"
screenshots = "0.5.4"

# File operations
dirs = "5.0.1"
lazy_static = "1.4.0"

# Error handling
anyhow = "1.0.71"
thiserror = "1.0.40"

# For window management - using cross-platform alternatives
winit = "0.28"
raw-window-handle = "0.5"
# Expand Windows support
[target.'cfg(windows)'.dependencies.windows]
version = "0.48"
features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
]

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winuser", "processthreadsapi", "winbase"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9.3"
objc = "0.2.7"

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
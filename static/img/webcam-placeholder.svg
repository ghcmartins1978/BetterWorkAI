<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="640" height="480" viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <rect width="640" height="480" fill="#1a1a1a" />
  
  <!-- Camera icon -->
  <g transform="translate(270, 180)" fill="#4a4a4a">
    <path d="M100 50 C100 77.6 77.6 100 50 100 C22.4 100 0 77.6 0 50 C0 22.4 22.4 0 50 0 C77.6 0 100 22.4 100 50 Z" />
    <circle cx="50" cy="50" r="30" fill="#2a2a2a" />
    <circle cx="50" cy="50" r="15" fill="#555" />
  </g>
  
  <!-- Camera label -->
  <text x="320" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#aaa">
    Webcam not active
  </text>
  
  <!-- Bottom instructions -->
  <text x="320" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#888">
    Click "Start Capture" to enable webcam
  </text>
  
  <!-- Privacy notice -->
  <text x="320" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    Privacy mode will be applied according to your settings
  </text>
  
  <!-- Border -->
  <rect x="10" y="10" width="620" height="460" stroke="#333" stroke-width="2" fill="none" />
</svg>
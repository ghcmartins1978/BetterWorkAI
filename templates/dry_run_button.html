<!-- Dry Run Button Component -->
<div class="dry-run-controls mb-3">
    <button type="button" class="btn btn-sm btn-outline-info" id="dry-run-btn" data-macro-id="{{ macro.macro_id }}">
        <i class="bi bi-play-circle me-1"></i> Dry Run
    </button>
    <small class="text-muted ms-2">Preview automation steps without executing them</small>

    <!-- Progress indicator (hidden by default) -->
    <div id="dry-run-progress" class="progress mt-2 d-none">
        <div class="progress-bar progress-bar-striped progress-bar-animated bg-info" 
             role="progressbar" 
             style="width: 0%" 
             aria-valuenow="0" 
             aria-valuemin="0" 
             aria-valuemax="100">
        </div>
    </div>
</div>

<!-- Script for dry run functionality -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const dryRunBtn = document.getElementById('dry-run-btn');
    const progressBar = document.querySelector('#dry-run-progress .progress-bar');
    const progressContainer = document.getElementById('dry-run-progress');
    
    if (dryRunBtn) {
        dryRunBtn.addEventListener('click', function() {
            const macroId = this.getAttribute('data-macro-id');
            
            // Show progress 
            progressContainer.classList.remove('d-none');
            progressBar.style.width = '10%';
            
            // Disable the button during execution
            dryRunBtn.disabled = true;
            
            // Call the API to execute the macro in dry-run mode
            fetch(`/api/automation/macros/${macroId}/execute`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    mode: 'dry-run'
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Dry run started:', data);
                progressBar.style.width = '30%';
                
                if (data.status === 'success') {
                    // Initialize the dry run manager with the steps
                    setTimeout(() => {
                        progressBar.style.width = '60%';
                        
                        // Start the visual simulation
                        if (window.dryRunManager) {
                            setTimeout(() => {
                                progressBar.style.width = '100%';
                                
                                // Get the macro details to display steps
                                fetch(`/api/automation/macros/${macroId}`)
                                    .then(response => response.json())
                                    .then(macroData => {
                                        if (macroData.status === 'success') {
                                            // Start the visual overlay
                                            window.dryRunManager.start(macroId, macroData.macro.steps);
                                            
                                            // Hide progress after overlay starts
                                            setTimeout(() => {
                                                progressContainer.classList.add('d-none');
                                                dryRunBtn.disabled = false;
                                            }, 1000);
                                        } else {
                                            showError('Failed to load macro details');
                                        }
                                    })
                                    .catch(err => {
                                        console.error('Error fetching macro:', err);
                                        showError('Failed to fetch macro details');
                                    });
                            }, 500);
                        } else {
                            showError('Dry run overlay not available');
                        }
                    }, 500);
                } else {
                    showError(data.message || 'Failed to start dry run');
                }
            })
            .catch(error => {
                console.error('Error starting dry run:', error);
                showError('Error starting dry run');
            });
        });
    }
    
    function showError(message) {
        // Hide progress and show error
        progressContainer.classList.add('d-none');
        dryRunBtn.disabled = false;
        
        // Display error notification
        const errorToast = document.createElement('div');
        errorToast.className = 'toast align-items-center text-white bg-danger border-0';
        errorToast.setAttribute('role', 'alert');
        errorToast.setAttribute('aria-live', 'assertive');
        errorToast.setAttribute('aria-atomic', 'true');
        
        errorToast.innerHTML = `
            <div class="d-flex">
                <div class="toast-body">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    ${message}
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        `;
        
        // Add to document
        const toastContainer = document.createElement('div');
        toastContainer.className = 'toast-container position-fixed top-0 end-0 p-3';
        toastContainer.appendChild(errorToast);
        document.body.appendChild(toastContainer);
        
        // Show the toast
        const toast = new bootstrap.Toast(errorToast);
        toast.show();
        
        // Remove from DOM after hidden
        errorToast.addEventListener('hidden.bs.toast', function() {
            document.body.removeChild(toastContainer);
        });
    }
});
</script>

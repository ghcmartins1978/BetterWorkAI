<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BettermanAI - {% block title %}Your Personal Workflow Optimizer{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-lightning-charge-fill text-primary me-2"></i>
                BettermanAI
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/suggestions">Suggestions</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/macros">Macros</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/patterns">Patterns</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/statistics">Statistics</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ai_reports">
                            <i class="bi bi-robot text-info me-1"></i>
                            AI Reports
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/monitor">
                            <i class="bi bi-activity text-success me-1"></i>
                            Monitoring
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/scheduled_jobs">
                            <i class="bi bi-calendar-check text-warning me-1"></i>
                            Scheduled Jobs
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/settings">
                            <i class="bi bi-gear me-1"></i>
                            Settings
                        </a>
                    </li>
                </ul>
                <div class="d-flex">
                    <a href="/about" class="btn btn-outline-light me-2">About</a>
                    <a href="/privacy" class="btn btn-outline-light">Privacy</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer mt-5 py-3 bg-dark">
        <div class="container text-center">
            <span class="text-muted">
                BettermanAI &copy; 2023 | 
                <a href="/privacy" class="text-muted">Privacy Policy</a> | 
                <a href="/about" class="text-muted">About</a>
            </span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
